<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نبض الذكريات | Pulse QR</title>
  
  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- مكتبة Canvas Confetti لتساقط الورود والشرار -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090b;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      color: #fff;
    }

    /* ---------------------------------- */
    /* 1. شاشة الغلاف والظرف الفاخر 3D */
    /* ---------------------------------- */
    #welcomeScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, #1a1e29 0%, #060709 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .welcome-title {
      color: #fff;
      font-size: 1.4rem;
      margin-bottom: 25px;
      font-family: 'Cairo', sans-serif;
      text-shadow: 0 0 10px rgba(224, 191, 115, 0.3);
    }

    /* مجسم الظرف الفاخر */
    .envelope-container {
      position: relative;
      width: 320px;
      height: 210px;
      background: #141720;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(224, 191, 115, 0.35);
      perspective: 1000px;
      cursor: pointer;
    }

    /* غطاء الظرف العلوي المثلث (Flap) */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 115px solid #1c212d;
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* جيب الظرف السفلي والجانبي */
    .envelope-pocket {
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 0;
      border-left: 160px solid #101218;
      border-right: 160px solid #101218;
      border-bottom: 110px solid #171b24;
      border-radius: 0 0 12px 12px;
      z-index: 3;
    }

    /* الختم الذهبي (Wax Seal) */
    .wax-seal {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      width: 78px;
      height: 78px;
      background: radial-gradient(circle, #f5d77f 0%, #d4af37 60%, #8a6d1c 100%);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 8px rgba(0,0,0,0.4);
      border: 2px solid #fff3c4;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: sealPulse 2s infinite alternate;
    }

    .wax-seal i {
      font-size: 1.1rem;
      color: #12141a;
      margin-bottom: 2px;
    }

    .wax-seal span {
      font-family: 'Amiri', serif;
      font-size: 0.8rem;
      font-weight: bold;
      color: #12141a;
      line-height: 1;
    }

    .envelope-container:hover .wax-seal {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
    }

    /* حركة فتح الظرف عند النقر */
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* تأثير الوميض الساطع (Flash Glow) */
    .flash-overlay {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: radial-gradient(circle, rgba(255,245,210,1) 0%, rgba(212,175,55,0.8) 40%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .flash-overlay.active {
      animation: flashGlow 0.9s ease-out forwards;
    }

    @keyframes flashGlow {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(90); opacity: 0.85; }
      100% { transform: translate(-50%, -50%) scale(180); opacity: 0; }
    }

    .open-hint {
      color: #d4af37;
      font-size: 0.95rem;
      margin-top: 30px;
      letter-spacing: 0.5px;
    }

    .loading-text {
      font-size: 18px;
      color: #e0bf73;
    }

    @keyframes sealPulse {
      from { box-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }
      to { box-shadow: 0 0 25px rgba(212, 175, 55, 0.8); }
    }

    /* ---------------------------------- */
    /* 2. كارت الهدية والشهادة الفاخرة */
    /* ---------------------------------- */
    .certificate-card {
      display: none;
      background: rgba(255, 255, 255, 0.97);
      border: 3px solid #dfb15b;
      outline: 2px solid #e0bf73;
      outline-offset: -6px;
      padding: 35px 25px 90px 25px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
      color: #222;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .occasion-badge {
      display: inline-block;
      background: #fdf3d8;
      color: #b8860b;
      border: 1px solid #e6ca65;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .recipient-title {
      font-family: 'Amiri', serif;
      font-size: 30px;
      color: #1a1a1a;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .gift-image {
      max-width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #dfb15b;
      margin: 15px 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .message-body {
      font-family: 'Amiri', serif;
      font-size: 21px;
      line-height: 1.8;
      color: #333;
      margin: 20px 0;
      white-space: pre-wrap;
      min-height: 60px;
    }

    /* مؤشر الكتابة المباشرة */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 22px;
      background-color: #d4af37;
      margin-right: 3px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .audio-container {
      margin-top: 20px;
      background: #faf6f0;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e0bf73;
    }

    audio {
      width: 100%;
      outline: none;
    }

    /* ---------------------------------- */
    /* 3. زر المفاجأة السرية التفاعلي */
    /* ---------------------------------- */
    .secret-box-btn {
      margin-top: 25px;
      background: linear-gradient(135deg, #1c212d 0%, #08090b 100%);
      color: #e0bf73;
      border: 1px solid #dfb15b;
      padding: 12px 24px;
      border-radius: 25px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .secret-box-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
    }

    /* النافذة المنبثقة للسر */
    .secret-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .secret-content {
      background: #fff;
      border: 2px solid #dfb15b;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      color: #222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: popupIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pulsing-heart {
      font-size: 3.5rem;
      color: #e84393;
      margin: 15px 0;
      animation: heartBeat 1s infinite alternate;
      cursor: pointer;
    }

    @keyframes heartBeat {
      to { transform: scale(1.2); }
    }

    @keyframes popupIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-modal-btn {
      margin-top: 15px;
      background: #dfb15b;
      color: #111;
      border: none;
      padding: 8px 20px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    /* ---------------------------------- */
    /* 4. الشريط السفلي الزجاجي */
    /* ---------------------------------- */
    .bottom-glass-nav {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 440px;
      background: rgba(20, 24, 33, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 191, 115, 0.4);
      border-radius: 30px;
      padding: 10px 20px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      justify-content: space-around;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #d1d5db;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Cairo', sans-serif;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn i {
      font-size: 1.2rem;
      color: #e0bf73;
      margin-bottom: 3px;
    }

    .nav-btn:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- شاشة الغلاف والظرف الفاخر 3D -->
  <div id="welcomeScreen">
    <div id="loading" class="loading-text">جاري تحميل الهدية...</div>
    
    <div id="readyContent" style="display: none; text-align: center;">
      <h2 class="welcome-title">لديك هدية خاصة ✨</h2>
      
      <!-- مجسم الظرف الفاخر -->
      <div class="envelope-container" id="envelopeBox">
        <div class="envelope-flap"></div>
        <div class="envelope-pocket"></div>
        
        <!-- الختم الذهبي -->
        <div class="wax-seal" id="openBtn">
          <i class="fa-solid fa-gift"></i>
          <span>نبض الذكريات</span>
        </div>

        <div class="flash-overlay" id="flashOverlay"></div>
      </div>
      
      <p class="open-hint">اضغط على الختم لفتح الهدية 🎁</p>
    </div>
  </div>

  <!-- شهادة التهنئة / كارت الهدية -->
  <div id="certificate" class="certificate-card">
    <div id="occasionBadge" class="occasion-badge" style="display: none;"></div>
    <h1 id="recipientName" class="recipient-title"></h1>
    <img id="giftImage" class="gift-image" src="" alt="صورة الهدية" style="display: none;">
    <p id="message" class="message-body"></p>
    
    <div class="audio-container" id="audioContainer" style="display: none;">
      <audio id="audioPlayer" controls></audio>
    </div>

    <!-- زر المفاجأة التفاعلي -->
    <button class="secret-box-btn" onclick="openSecretModal()">
      <i class="fa-solid fa-heart-pulse"></i>
      <span>اضغط هنا لمفاجأة خاصة 🤍</span>
    </button>
  </div>

  <!-- النافذة المنبثقة للمفاجأة السرية -->
  <div class="secret-modal" id="secretModal">
    <div class="secret-content">
      <h3 style="font-family: 'Amiri', serif; font-size: 1.5rem; color: #1a1a1a;">بصمة حب لك ✨</h3>
      <div class="pulsing-heart" onclick="triggerHeartBurst()">❤️</div>
      <p style="font-family: 'Cairo', sans-serif; font-size: 0.95rem; color: #555;">
        اضغط على القلب لتصلك آلاف المشاعر والبتلات الدائمة!
      </p>
      <button class="close-modal-btn" onclick="closeSecretModal()">إغلاق</button>
    </div>
  </div>

  <!-- الشريط السفلي الزجاجي للمستلم -->
  <nav class="bottom-glass-nav" id="bottomNav">
    <button class="nav-btn" onclick="scrollToElement('message')">
      <i class="fa-solid fa-envelope-open-text"></i>
      <span>الرسالة</span>
    </button>
    <button class="nav-btn" onclick="scrollToElement('giftImage')">
      <i class="fa-solid fa-image"></i>
      <span>الصورة</span>
    </button>
    <button class="nav-btn" onclick="scrollToElement('audioContainer')">
      <i class="fa-solid fa-music"></i>
      <span>الصوت</span>
    </button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      projectId: "gift-qr-e2142"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let giftData = null;

    const urlParams = new URLSearchParams(window.location.search);
    const giftId = urlParams.get('id');

    // المؤثرات الصوتية المضافة
    function playOpenSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    async function fetchGift() {
      if (!giftId) {
        document.getElementById('loading').textContent = "رابط الهدية غير صحيح.";
        return;
      }

      try {
        const doc = await db.collection('gifts').doc(giftId).get();
        if (doc.exists) {
          giftData = doc.data();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('readyContent').style.display = 'block';
        } else {
          document.getElementById('loading').textContent = "لم يتم العثور على الهدية المطلوب عرضها.";
        }
      } catch (error) {
        console.error("Error fetching gift:", error);
        document.getElementById('loading').textContent = "حدث خطأ أثناء تحميل البيانات.";
      }
    }

    // تأثير كتابة النص الحية (Typing Effect)
    function typeWriterEffect(text, elementId, speed = 50) {
      const element = document.getElementById(elementId);
      element.innerHTML = '';
      
      const cursor = document.createElement('span');
      cursor.className = 'typing-cursor';
      element.appendChild(cursor);

      let i = 0;
      function type() {
        if (i < text.length) {
          cursor.before(text.charAt(i));
          i++;
          setTimeout(type, speed);
        } else {
          setTimeout(() => {
            cursor.remove();
          }, 2000);
        }
      }
      type();
    }

    // تأثير تساقط الورود والشرارات الذهبية
    function triggerRosePetals() {
      const duration = 4 * 1000;
      const animationEnd = Date.now() + duration;

      const colors = ['#ffb7c5', '#e84393', '#fd79a8', '#d4af37', '#fdf3d8'];

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 60,
          origin: { x: 0, y: 0.6 },
          colors: colors,
          shapes: ['circle']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 60,
          origin: { x: 1, y: 0.6 },
          colors: colors,
          shapes: ['circle']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // تفجير قلوب عند الضغط على القلب داخل النافذة السرية
    function triggerHeartBurst() {
      confetti({
        particleCount: 40,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#e84393', '#d63031', '#fd79a8']
      });
    }

    function openSecretModal() {
      document.getElementById('secretModal').style.display = 'flex';
      triggerHeartBurst();
    }

    function closeSecretModal() {
      document.getElementById('secretModal').style.display = 'none';
    }

    function scrollToElement(id) {
      const el = document.getElementById(id);
      if (el && el.style.display !== 'none') {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // تشغيل أنيميشن الفتح والوميض والكتابة والصوت
    document.getElementById('envelopeBox').addEventListener('click', () => {
      const envelope = document.getElementById('envelopeBox');
      const flash = document.getElementById('flashOverlay');
      
      // 1. تشغيل صوت الفتح
      try { playOpenSound(); } catch(e){}

      // 2. فتح غطاء الظرف 3D
      envelope.classList.add('open');

      // 3. انطلاق الوميض الساطع
      setTimeout(() => {
        flash.classList.add('active');
      }, 350);

      // 4. إخفاء شاشة الغلاف وتجهيز كارت الهدية
      setTimeout(() => {
        const welcomeScreen = document.getElementById('welcomeScreen');
        welcomeScreen.style.opacity = '0';

        if (giftData.occasion) {
          const badge = document.getElementById('occasionBadge');
          badge.textContent = giftData.occasion;
          badge.style.display = 'inline-block';
        }

        document.getElementById('recipientName').textContent = giftData.recipientName || '';

        if (giftData.imageUrl) {
          const img = document.getElementById('giftImage');
          img.src = giftData.imageUrl;
          img.style.display = 'block';
        }

        if (giftData.audioUrl) {
          const audio = document.getElementById('audioPlayer');
          audio.src = giftData.audioUrl;
          document.getElementById('audioContainer').style.display = 'block';
          audio.play().catch(e => console.log("تنبيه: يتطلب إذن التفاعل لتمكين التشغيل التلقائي للصوت."));
        }

        document.getElementById('certificate').style.display = 'block';
        document.getElementById('bottomNav').style.display = 'flex';

        // تشغيل تأثير كتابة النص الحية عند الظهور
        if (giftData.message) {
          typeWriterEffect(giftData.message, 'message', 45);
        }

        triggerRosePetals();

        setTimeout(() => {
          welcomeScreen.style.display = 'none';
        }, 500);
      }, 850);
    });

    fetchGift();
  </script>

</body>
</html>
