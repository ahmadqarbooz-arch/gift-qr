<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="هدية خاصة لك ❤️"
  >

  <title>هدية لك ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- شاشة التحميل -->
  <div id="loadingScreen" class="screen">
    <div class="loading-box">
      <div class="loader-heart">❤️</div>
      <h2>جاري تجهيز هديتك</h2>
      <p>لحظات صغيرة...</p>
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>


  <!-- شاشة الخطأ -->
  <div id="errorScreen" class="screen hidden">
    <div class="error-box">

      <div class="error-icon">💔</div>

      <h1>عذراً</h1>

      <p id="errorMessage">
        لم نتمكن من العثور على هذه الهدية.
      </p>

      <button
        type="button"
        onclick="location.href = location.pathname"
      >
        العودة
      </button>

    </div>
  </div>


  <!-- صفحة الهدية -->
  <main id="giftPage" class="gift-page hidden">

    <div class="gift-card">

      <div class="gift-top">
        <div class="sparkle">✨</div>
        <div class="heart-small">❤️</div>
        <div class="sparkle">✨</div>
      </div>


      <h1 class="gift-title">
        عندي هدية إلك ❤️
      </h1>


      <p class="gift-subtitle">
        في شيء صغير حابب أهديك ياه...
      </p>


      <!-- الغلاف -->
      <section id="cover" class="cover">

        <div class="cover-decoration">🎁</div>

        <h2>
          هدية خاصة إلك
        </h2>

        <p>
          اضغط على الزر لتفتح هديتك
        </p>

        <button
          id="openGiftButton"
          type="button"
          class="open-gift-button"
        >
          <span>افتح الهدية</span>
          <span>✨</span>
        </button>

      </section>


      <!-- محتوى الهدية -->
      <section id="gift" class="gift-content hidden">

        <div class="gift-header">
          <span>💌</span>
          <h2>إلك أنت</h2>
          <span>❤️</span>
        </div>


        <!-- اسم المستلم -->
        <div
          id="recipient"
          class="recipient"
        ></div>


        <!-- الصورة -->
        <div
          class="photo-container"
          id="photoContainer"
        >
          <div
            class="photo-placeholder"
            aria-label="صورة الهدية"
          >
            🎁
          </div>
        </div>


        <!-- الرسالة -->
        <div class="message-box">

          <div class="message-icon">
            💖
          </div>

          <p
            id="messageText"
            class="message-text"
          ></p>

        </div>


        <!-- الموسيقى -->
        <button
          id="musicBtn"
          type="button"
          class="music-button"
        >
          🎵 تشغيل الموسيقى
        </button>


        <div class="bottom-hearts">
          ❤️ ✨ ❤️ ✨ ❤️
        </div>

      </section>

    </div>

  </main>


  <!-- JavaScript -->
  <script type="module" src="script.js"></script>

</body>
</html>
