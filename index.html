<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>هدية لك ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- شاشة تحميل الهدية -->
  <div id="loadingScreen" class="screen">
    <div class="loader">❤️</div>
    <p>جاري تجهيز هديتك...</p>
  </div>


  <!-- شاشة الخطأ -->
  <div id="errorScreen" class="screen hidden">
    <div class="error-box">
      <div class="error-icon">💔</div>

      <h1>عذرًا!</h1>

      <p id="errorMessage">
        لم نتمكن من العثور على هذه الهدية.
      </p>

      <button onclick="location.reload()">
        المحاولة مرة أخرى
      </button>
    </div>
  </div>


  <!-- صفحة الهدية -->
  <main id="giftPage" class="gift-page hidden">

    <div class="gift-card">

      <!-- العنوان -->
      <div class="gift-header">
        <div class="heart">❤️</div>

        <h1 id="giftTitle">
          لديك هدية!
        </h1>

        <p id="giftFrom">
          هدية خاصة لك
        </p>
      </div>


      <!-- الصورة - تظهر فقط إذا كانت الهدية تحتوي على صورة -->
      <div id="imageContainer" class="image-container hidden">
        <img
          id="giftImage"
          src=""
          alt="صورة الهدية"
        >
      </div>


      <!-- الرسالة -->
      <div class="gift-message">

        <p id="giftMessage">
          هناك رسالة خاصة بانتظارك ❤️
        </p>

      </div>


      <!-- زر فتح الهدية -->
      <button
        id="openGiftButton"
        class="open-gift-button"
        type="button"
      >
        افتح الهدية ✨
      </button>


      <!-- المحتوى المخفي -->
      <div id="giftContent" class="gift-content hidden">

        <div class="gift-content-inner">

          <div class="gift-icon">
            🎁
          </div>

          <h2 id="contentTitle">
            هديتك وصلت ❤️
          </h2>

          <p id="contentMessage">
            أتمنى أن تكون هذه الهدية قد أسعدتك.
          </p>

        </div>

      </div>

    </div>

  </main>


  <!-- ملف JavaScript -->
  <script src="script.js"></script>

</body>
</html>
