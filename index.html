<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نبض الذكريات | Pulse QR</title>
  
  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- مكتبة Canvas Confetti لتساقط الورود -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0f12;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      color: #fff;
    }

    /* ---------------------------------- */
    /* 1. غلاف الهدية والختم الذهبي (Unboxing) */
    /* ---------------------------------- */
    #welcomeScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, #1a1e26 0%, #0d0f12 100%);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .envelope-box {
      text-align: center;
      max-width: 380px;
      width: 90%;
      position: relative;
    }

    .wax-seal-btn {
      width: 95px;
      height: 95px;
      background: radial-gradient(circle, #f39c12, #d4af37, #9a7d0a);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 25px auto 0 auto;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(0,0,0,0.3);
      border: 3px solid #ffe89c;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      animation: pulseGlow 2s infinite alternate;
    }

    .wax-seal-btn:hover {
      transform: scale(1.08) rotate(3deg);
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.8);
    }

    .seal-logo {
      font-family: 'Amiri', serif;
      font-size: 1rem;
      font-weight: bold;
      color: #111;
      line-height: 1.1;
    }

    .seal-icon {
      font-size: 1.2rem;
      color: #111;
      margin-bottom: 2px;
    }

    .open-hint {
      color: #d4af37;
      font-size: 0.95rem;
      margin-top: 15px;
      letter-spacing: 0.5px;
    }

    .loading-text {
      font-size: 18px;
      color: #e0bf73;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
      to { box-shadow: 0 0 30px rgba(212, 175, 55, 0.8); }
    }

    /* ---------------------------------- */
    /* 2. كارت الهدية والشهادة الفاخرة */
    /* ---------------------------------- */
    .certificate-card {
      display: none;
      background: rgba(255, 255, 255, 0.97);
      border: 3px solid #dfb15b;
      outline: 2px solid #e0bf73;
      outline-offset: -6px;
      padding: 35px 25px 90px 25px; /* مساحة متناسقة مع الشريط السفلي */
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
      color: #222;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .occasion-badge {
      display: inline-block;
      background: #fdf3d8;
      color: #b8860b;
      border: 1px solid #e6ca65;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .recipient-title {
      font-family: 'Amiri', serif;
      font-size: 30px;
      color: #1a1a1a;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .gift-image {
      max-width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #dfb15b;
      margin: 15px 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .message-body {
      font-family: 'Amiri', serif;
      font-size: 21px;
      line-height: 1.8;
      color: #333;
      margin: 20px 0;
      white-space: pre-wrap;
    }

    .audio-container {
      margin-top: 20px;
      background: #faf6f0;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e0bf73;
    }

    audio {
      width: 100%;
      outline: none;
    }

    /* ---------------------------------- */
    /* 3. الشريط السفلي الزجاجي (Glass Nav) */
    /* ---------------------------------- */
    .bottom-glass-nav {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 440px;
      background: rgba(20, 24, 33, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 191, 115, 0.4);
      border-radius: 30px;
      padding: 10px 20px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      justify-content: space-around;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #d1d5db;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Cairo', sans-serif;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn i {
      font-size: 1.2rem;
      color: #e0bf73;
      margin-bottom: 3px;
    }

    .nav-btn:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- شاشة الغلاف والختم الذهبي -->
  <div id="welcomeScreen">
    <div class="envelope-box">
      <div id="loading" class="loading-text">جاري تحميل الهدية...</div>
      <div id="readyContent" style="display: none;">
        <h2 style="color: #fff; font-size: 1.4rem;">لديك هدية خاصة ✨</h2>
        
        <!-- الختم الذهبي -->
        <div class="wax-seal-btn" id="openBtn">
          <i class="fa-solid fa-gift seal-icon"></i>
          <span class="seal-logo">نبض الذكريات</span>
        </div>
        
        <p class="open-hint">اضغط على الختم لفتح الهدية 🎁</p>
      </div>
    </div>
  </div>

  <!-- شهادة التهنئة / كارت الهدية -->
  <div id="certificate" class="certificate-card">
    <div id="occasionBadge" class="occasion-badge" style="display: none;"></div>
    <h1 id="recipientName" class="recipient-title"></h1>
    <img id="giftImage" class="gift-image" src="" alt="صورة الهدية" style="display: none;">
    <p id="message" class="message-body"></p>
    
    <div class="audio-container" id="audioContainer" style="display: none;">
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <!-- الشريط السفلي الزجاجي للمستلم -->
  <nav class="bottom-glass-nav" id="bottomNav">
    <button class="nav-btn" onclick="scrollToElement('message')">
      <i class="fa-solid fa-envelope-open-text"></i>
      <span>الرسالة</span>
    </button>
    <button class="nav-btn" onclick="scrollToElement('giftImage')">
      <i class="fa-solid fa-image"></i>
      <span>الصورة</span>
    </button>
    <button class="nav-btn" onclick="scrollToElement('audioContainer')">
      <i class="fa-solid fa-music"></i>
      <span>الصوت</span>
    </button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      projectId: "gift-qr-e2142"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let giftData = null;

    // الحصول على ID الهدية من رابط الصفحة (?id=XXX)
    const urlParams = new URLSearchParams(window.location.search);
    const giftId = urlParams.get('id');

    async function fetchGift() {
      if (!giftId) {
        document.getElementById('loading').textContent = "رابط الهدية غير صحيح.";
        return;
      }

      try {
        const doc = await db.collection('gifts').doc(giftId).get();
        if (doc.exists) {
          giftData = doc.data();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('readyContent').style.display = 'block';
        } else {
          document.getElementById('loading').textContent = "لم يتم العثور على الهدية المطلوب عرضها.";
        }
      } catch (error) {
        console.error("Error fetching gift:", error);
        document.getElementById('loading').textContent = "حدث خطأ أثناء تحميل البيانات.";
      }
    }

    // تأثير تساقط الورود (Rose Petals Animation)
    function triggerRosePetals() {
      const duration = 4 * 1000;
      const animationEnd = Date.now() + duration;

      const colors = ['#ffb7c5', '#e84393', '#fd79a8', '#d63031', '#f8a5c2'];

      (function frame() {
        confetti({
          particleCount: 3,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.6 },
          colors: colors,
          shapes: ['circle']
        });
        confetti({
          particleCount: 3,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.6 },
          colors: colors,
          shapes: ['circle']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // التنقل السلس عبر الشريط السفلي
    function scrollToElement(id) {
      const el = document.getElementById(id);
      if (el && el.style.display !== 'none') {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // فتح الهدية وعرض البيانات
    document.getElementById('openBtn').addEventListener('click', () => {
      // إخفاء غلاف الفتح بنعومة
      const welcomeScreen = document.getElementById('welcomeScreen');
      welcomeScreen.style.opacity = '0';
      setTimeout(() => {
        welcomeScreen.style.display = 'none';
      }, 800);

      // تعبئة البيانات
      if (giftData.occasion) {
        const badge = document.getElementById('occasionBadge');
        badge.textContent = giftData.occasion;
        badge.style.display = 'inline-block';
      }

      document.getElementById('recipientName').textContent = giftData.recipientName || '';
      document.getElementById('message').textContent = giftData.message || '';

      if (giftData.imageUrl) {
        const img = document.getElementById('giftImage');
        img.src = giftData.imageUrl;
        img.style.display = 'block';
      }

      if (giftData.audioUrl) {
        const audio = document.getElementById('audioPlayer');
        audio.src = giftData.audioUrl;
        document.getElementById('audioContainer').style.display = 'block';
        audio.play().catch(e => console.log("تنبيه: يتطلب إذن التفاعل لتمكين التشغيل التلقائي للصوت."));
      }

      // إظهار بطاقة الهدية والشريط السفلي
      document.getElementById('certificate').style.display = 'block';
      document.getElementById('bottomNav').style.display = 'flex';

      // تشغيل تأثير الورود
      triggerRosePetals();
    });

    fetchGift();
  </script>

</body>
</html>
