<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هدية لك ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>❤</span><span>♡</span><span>❤</span><span>♡</span><span>❤</span>
  </div>

  <main class="page">
    <section class="intro" id="intro">
      <div class="badge">هدية خاصة لك</div>
      <div class="gift" id="gift" role="button" tabindex="0" aria-label="افتح الهدية">
        <div class="gift-lid"></div>
        <div class="gift-box">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
        <div class="bow">🎀</div>
      </div>
      <h1>في هدية صغيرة مستنياك ❤️</h1>
      <p>اضغط على الهدية لفتحها</p>
      <button class="open-btn" id="openBtn">افتح الهدية ✨</button>
    </section>

    <section class="card hidden" id="card">
      <div class="sparkle">✦</div>
      <p class="eyebrow">إلى الشخص المميز</p>
      <h2 id="recipient">إلى أحمد ❤️</h2>

      <div class="photo-placeholder" aria-label="مكان الصورة">
        <span>📷</span>
        <small>ضع صورتك هنا لاحقًا</small>
      </div>

      <div class="message">
        <p id="messageText">
          هذه أول نسخة من هديتك الرقمية. هنا سنضع الرسالة الخاصة، الصور،
          والموسيقى لاحقًا من لوحة التحكم.
        </p>
      </div>

      <button class="music-btn" id="musicBtn">🎵 تشغيل الموسيقى</button>
      <p class="hint">استمتع بالهدية ❤️</p>
    </section>
  </main>

  <footer>صُنعت بحب ❤️</footer>
  <script src="script.js"></script>
</body>
</html>
