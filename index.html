<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لديك هدية خاصة! 🎁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="loader" class="screen">
    <div class="spinner"></div>
    <h2>جاري تجهيز هديتك... 🎁</h2>
  </div>

  <!-- شاشة الخطأ -->
  <div id="errorScreen" class="screen hidden">
    <div class="card error-card">
      <div class="icon">⚠️</div>
      <h2 id="errorMessage">عذرًا، تعذر العثور على الهدية!</h2>
      <p>تأكد من صحة الرابط وحاول مرة أخرى.</p>
    </div>
  </div>

  <!-- شاشة الغلاف (قبل الفتح) -->
  <div id="coverScreen" class="screen hidden">
    <div class="card cover-card">
      <div class="gift-box-icon">🎁</div>
      <h1 id="recipientGreeting">وصلتك هدية خاصة!</h1>
      <p>اضغط على الزر بالأسفل لرؤية المفاجأة</p>
      <button id="openBtn" class="primary-btn">افتح الهدية ✨</button>
    </div>
  </div>

  <!-- شاشة محتوى الهدية (بعد الفتح) -->
  <div id="giftScreen" class="screen hidden">
    <div class="card gift-card">
      <div class="sparkles">✨ 🎉 ✨</div>
      <h2 class="to-text">إلى: <span id="giftRecipient"></span></h2>
      
      <div id="imageContainer" class="image-container hidden">
        <img id="giftImage" src="" alt="صورة الهدية">
      </div>

      <div class="message-box">
        <p id="giftMessage"></p>
      </div>

      <div class="footer-text">صنعت لك بكل حب ❤️</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
