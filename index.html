<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هدية خاصة لك</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة Canvas Confetti لتساقط الورود -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #faf6f0;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* شاشة البدء */
    #welcomeScreen {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }

    #openBtn {
      background: linear-gradient(135deg, #b8860b, #e6ca65);
      color: #fff;
      border: none;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 20px;
    }

    #openBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(184, 134, 11, 0.4);
    }

    /* كارت الشهادة/البطاقة الفاخرة */
    .certificate-card {
      display: none;
      background: #fffdf9;
      border: 12px solid #dfb15b;
      outline: 3px solid #e0bf73;
      outline-offset: -8px;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      max-width: 600px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .occasion-badge {
      display: inline-block;
      background: #fdf3d8;
      color: #b8860b;
      border: 1px solid #e6ca65;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .recipient-title {
      font-family: 'Amiri', serif;
      font-size: 32px;
      color: #333;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .gift-image {
      max-width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      border: 3px solid #dfb15b;
      margin: 20px 0;
    }

    .message-body {
      font-family: 'Amiri', serif;
      font-size: 20px;
      line-height: 1.8;
      color: #444;
      margin: 20px 0;
      white-space: pre-wrap;
    }

    .audio-container {
      margin-top: 25px;
    }

    audio {
      width: 100%;
      outline: none;
    }

    .loading-text {
      font-size: 18px;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- شاشة البدء -->
  <div id="welcomeScreen">
    <div id="loading" class="loading-text">جاري تحميل الهدية...</div>
    <div id="readyContent" style="display: none;">
      <h2>لديك هدية خاصة!</h2>
      <button id="openBtn">افتح الهدية 🎁</button>
    </div>
  </div>

  <!-- شهادة التهنئة الفاخرة -->
  <div id="certificate" class="certificate-card">
    <div id="occasionBadge" class="occasion-badge" style="display: none;"></div>
    <h1 id="recipientName" class="recipient-title"></h1>
    <img id="giftImage" class="gift-image" src="" alt="صورة الهدية" style="display: none;">
    <p id="message" class="message-body"></p>
    
    <div class="audio-container" id="audioContainer" style="display: none;">
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      projectId: "gift-qr-e2142"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let giftData = null;

    // الحصول على ID الهدية من رابط الصفحة (?id=XXX)
    const urlParams = new URLSearchParams(window.location.search);
    const giftId = urlParams.get('id');

    async function fetchGift() {
      if (!giftId) {
        document.getElementById('loading').textContent = "رابط الهدية غير صحيح.";
        return;
      }

      try {
        const doc = await db.collection('gifts').doc(giftId).get();
        if (doc.exists) {
          giftData = doc.data();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('readyContent').style.display = 'block';
        } else {
          document.getElementById('loading').textContent = "لم يتم العثور على الهدية المطلوب عرضها.";
        }
      } catch (error) {
        console.error("Error fetching gift:", error);
        document.getElementById('loading').textContent = "حدث خطأ أثناء تحميل البيانات.";
      }
    }

    // تأثير تساقط الورود (Rose Petals Animation)
    function triggerRosePetals() {
      const duration = 4 * 1000;
      const animationEnd = Date.now() + duration;

      const colors = ['#ffb7c5', '#e84393', '#fd79a8', '#d63031', '#f8a5c2'];

      (function frame() {
        confetti({
          particleCount: 3,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.6 },
          colors: colors,
          shapes: ['circle']
        });
        confetti({
          particleCount: 3,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.6 },
          colors: colors,
          shapes: ['circle']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // فتح الهدية وعرض البيانات
    document.getElementById('openBtn').addEventListener('click', () => {
      document.getElementById('welcomeScreen').style.display = 'none';

      // تعبئة البيانات
      if (giftData.occasion) {
        const badge = document.getElementById('occasionBadge');
        badge.textContent = giftData.occasion;
        badge.style.display = 'inline-block';
      }

      document.getElementById('recipientName').textContent = giftData.recipientName || '';
      document.getElementById('message').textContent = giftData.message || '';

      if (giftData.imageUrl) {
        const img = document.getElementById('giftImage');
        img.src = giftData.imageUrl;
        img.style.display = 'block';
      }

      if (giftData.audioUrl) {
        const audio = document.getElementById('audioPlayer');
        audio.src = giftData.audioUrl;
        document.getElementById('audioContainer').style.display = 'block';
        audio.play().catch(e => console.log("تنبيه: يتطلب إذن التفاعل لتمكين التشغيل التلقائي للصوت."));
      }

      document.getElementById('certificate').style.display = 'block';

      // تشغيل تأثير الورود
      triggerRosePetals();
    });

    fetchGift();
  </script>

</body>
</html>
