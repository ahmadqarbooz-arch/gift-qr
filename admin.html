<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء هدية 🎁</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="gift-page">
    <div class="gift-card">

      <div class="gift-top">
        <span>✨</span>
        <span class="heart-small">❤️</span>
        <span>✨</span>
      </div>

      <h1 class="gift-title">إنشاء هدية 🎁</h1>

      <p class="gift-subtitle">
        أنشئ هدية خاصة وشارك رابطها مع من تحب ❤️
      </p>

      <section class="gift-content">

        <form id="giftForm">

          <div style="text-align:right;margin-bottom:18px;">
            <label for="recipient">اسم المستلم</label>
            <input
              id="recipient"
              type="text"
              placeholder="مثلاً: أحمد"
              required
              style="width:100%;padding:14px;margin-top:8px;border:1px solid #f0cbd5;border-radius:12px;font-size:16px;"
            >
          </div>

          <div style="text-align:right;margin-bottom:18px;">
            <label for="message">رسالة الهدية</label>
            <textarea
              id="message"
              placeholder="اكتب رسالتك هنا..."
              required
              rows="6"
              style="width:100%;padding:14px;margin-top:8px;border:1px solid #f0cbd5;border-radius:12px;font-size:16px;resize:vertical;"
            ></textarea>
          </div>

          <div style="text-align:right;margin-bottom:20px;">
            <label for="photo">صورة الهدية (اختياري)</label>
            <input
              id="photo"
              type="file"
              accept="image/*"
              style="width:100%;margin-top:10px;"
            >
          </div>

          <button
            id="createGiftButton"
            type="submit"
            class="open-gift-button"
          >
            إنشاء الهدية 🎁
          </button>

        </form>

        <div id="result" class="hidden" style="margin-top:25px;">

          <div class="message-box">

            <div class="message-icon">🎉</div>

            <h2>تم إنشاء الهدية!</h2>

            <p
              id="giftLink"
              style="margin-top:15px;word-break:break-all;line-height:1.8;"
            ></p>

            <button
              id="copyLinkButton"
              type="button"
              class="music-button"
            >
              📋 نسخ الرابط
            </button>

            <br><br>

            <a
              id="openGiftLink"
              href="#"
              target="_blank"
              class="open-gift-button"
              style="display:inline-flex;text-decoration:none;"
            >
              فتح الهدية ❤️
            </a>

          </div>

        </div>

      </section>

    </div>
  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
