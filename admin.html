<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء هدية جديدة</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { text-align: center; color: #d81b60; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #d81b60;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎁 إنشاء هدية جديدة</h2>
  <form id="giftForm">
    <div class="form-group">
      <label>اسم المستلم:</label>
      <input type="text" id="recipientName" required placeholder="مثال: أحمد">
    </div>
    <div class="form-group">
      <label>رسالة الهدية:</label>
      <textarea id="message" rows="4" required placeholder="اكتب رسالتك هنا..."></textarea>
    </div>
    <div class="form-group">
      <label>اختر صورة من الجوال (اختياري):</label>
      <input type="file" id="imageFile" accept="image/*">
    </div>
    <button type="submit" id="submitBtn">إنشاء الهدية 🚀</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSy...", // استبدل هذه الإعدادات بإعدادات مشروعك في Firebase
    authDomain: "gift-qr-e2142.firebaseapp.com",
    projectId: "gift-qr-e2142",
    storageBucket: "gift-qr-e2142.appspot.com",
    messagingSenderId: "...",
    appId: "..."
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById('giftForm');
  const submitBtn = document.getElementById('submitBtn');

  function convertBase64(file) {
    return new Promise((resolve, reject) => {
      const fileReader = new FileReader();
      fileReader.readAsDataURL(file);
      fileReader.onload = () => resolve(fileReader.result);
      fileReader.onerror = (error) => reject(error);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = "جاري إنشاء الهدية... ⏳";

    try {
      const recipientName = document.getElementById('recipientName').value;
      const message = document.getElementById('message').value;
      const fileInput = document.getElementById('imageFile');
      let imageUrl = "";

      if (fileInput.files.length > 0) {
        imageUrl = await convertBase64(fileInput.files[0]);
      }

      const docRef = await addDoc(collection(db, "gifts"), {
        recipientName: recipientName,
        message: message,
        imageUrl: imageUrl,
        createdAt: new Date()
      });

      window.location.href = `index.html?id=${docRef.id}`;
    } catch (error) {
      alert("حدث خطأ أثناء حفظ الهدية: " + error.message);
      submitBtn.disabled = false;
      submitBtn.innerText = "إنشاء الهدية 🚀";
    }
  });
</script>

</body>
</html>
