<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - QR Gift</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #d4af37;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #b8962d;
    }

    .status-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
    }

    .status-success { color: #27ae60; }
    .status-error { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="container">
    <h2>إنشاء هدية جديدة</h2>
    <form id="giftForm">
      <div class="form-group">
        <label for="recipientName">اسم المستلم *</label>
        <input type="text" id="recipientName" required placeholder="أدخل اسم المستلم">
      </div>

      <div class="form-group">
        <label for="occasion">نوع المناسبة (اختياري)</label>
        <input type="text" id="occasion" placeholder="مثال: عيد ميلاد، تخرج، نجاح...">
      </div>

      <div class="form-group">
        <label for="message">الرسالة *</label>
        <textarea id="message" rows="4" required placeholder="اكتب تهنئتك هنا..."></textarea>
      </div>

      <div class="form-group">
        <label for="audioUrl">رابط ملف الصوت (MP3)</label>
        <input type="url" id="audioUrl" placeholder="https://example.com/audio.mp3">
      </div>

      <div class="form-group">
        <label for="imageUrl">رابط الصورة</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
      </div>

      <button type="submit" id="submitBtn">حفظ الهدية</button>
    </form>
    <div id="status" class="status-message"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      projectId: "gift-qr-e2142"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const giftForm = document.getElementById('giftForm');
    const statusDiv = document.getElementById('status');

    giftForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusDiv.textContent = 'جاري الحفظ...';
      statusDiv.className = 'status-message';

      const recipientName = document.getElementById('recipientName').value.trim();
      const occasion = document.getElementById('occasion').value.trim();
      const message = document.getElementById('message').value.trim();
      const audioUrl = document.getElementById('audioUrl').value.trim();
      const imageUrl = document.getElementById('imageUrl').value.trim();

      try {
        const docRef = await db.collection('gifts').add({
          recipientName: recipientName,
          occasion: occasion || "",
          message: message,
          audioUrl: audioUrl || "",
          imageUrl: imageUrl || "",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        statusDiv.textContent = `تم حفظ الهدية بنجاح! المعرف: ${docRef.id}`;
        statusDiv.className = 'status-message status-success';
        giftForm.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        statusDiv.textContent = 'حدث خطأ أثناء الحفظ. يرجى المحاولة مرة أخرى.';
        statusDiv.className = 'status-message status-error';
      }
    });
  </script>

</body>
</html>
