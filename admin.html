<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - QR Gift</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة QRCode.js لتوليد الـ QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary-color: #d4af37;
      --primary-hover: #b8962d;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="url"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
      background-color: #fff;
    }

    input:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #2c3e50;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #1a252f;
    }

    .btn-success {
      background-color: #27ae60;
      margin-top: 10px;
    }

    .btn-success:hover {
      background-color: #219150;
    }

    .status-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
    }

    .status-success { color: #27ae60; }
    .status-error { color: #e74c3c; }

    /* منطقة الـ QR Code وزر المعاينة */
    #qrContainer {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #eeeeee;
      text-align: center;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }

    #qrcode img {
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .image-preview {
      max-width: 100%;
      max-height: 150px;
      margin-top: 10px;
      border-radius: 8px;
      display: none;
      object-fit: cover;
    }

    /* إضافة صندوق التعديل في أعلى اللوحة */
    .search-box {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px dashed #d4af37;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">إنشاء هدية جديدة</h2>

    <!-- قسم تعديل هدية سابقة -->
    <div class="search-box">
      <label for="searchGiftId">تعديل هدية سابقة (إدخال الـ ID أو الرابط):</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="searchGiftId" placeholder="أدخل ID الهدية أو رابطها">
        <button type="button" id="loadGiftBtn" style="width: auto; padding: 0 15px;">جلب</button>
      </div>
    </div>

    <form id="giftForm">
      <!-- حقل مخفي لضبط معرف الهدية الجاري تعديلها -->
      <input type="hidden" id="editingDocId" value="">

      <div class="form-group">
        <label for="recipientName">اسم المستلم *</label>
        <input type="text" id="recipientName" required placeholder="أدخل اسم المستلم">
      </div>

      <div class="form-group">
        <label for="occasion">نوع المناسبة (اختياري)</label>
        <input type="text" id="occasion" placeholder="مثال: عيد ميلاد، تخرج، نجاح...">
      </div>

      <div class="form-group">
        <label for="message">الرسالة *</label>
        <textarea id="message" rows="4" required placeholder="اكتب تهنئتك هنا..."></textarea>
      </div>

      <div class="form-group">
        <label for="audioUrl">رابط ملف الصوت (MP3)</label>
        <input type="url" id="audioUrl" placeholder="https://example.com/audio.mp3">
      </div>

      <div class="form-group">
        <label for="imageFile">اختيار صورة الهدية (من الجهاز/الجوال)</label>
        <input type="file" id="imageFile" accept="image/*">
        <img id="imagePreview" class="image-preview" alt="معاينة الصورة">
      </div>

      <button type="submit" id="submitBtn">حفظ الهدية</button>
      <button type="button" id="cancelEditBtn" class="btn-secondary" style="display: none;">إلغاء التعديل والبدء بجديد</button>
    </form>

    <div id="status" class="status-message"></div>

    <!-- قسم الـ QR Code والإجراءات بعد الحفظ -->
    <div id="qrContainer">
      <h3 style="color: #2c3e50; margin-bottom: 10px;">رمز QR للهدية</h3>
      <div id="qrcode"></div>
      
      <button id="copyBtn" class="btn-success">نسخ رابط الهدية 📋</button>
      <a id="previewLink" href="#" target="_blank" style="text-decoration: none;">
        <button class="btn-secondary">معاينة الهدية 👁️</button>
      </a>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      projectId: "gift-qr-e2142"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const giftForm = document.getElementById('giftForm');
    const statusDiv = document.getElementById('status');
    const imageFileInput = document.getElementById('imageFile');
    const imagePreview = document.getElementById('imagePreview');
    const qrContainer = document.getElementById('qrContainer');
    const qrcodeDiv = document.getElementById('qrcode');
    const copyBtn = document.getElementById('copyBtn');
    const previewLink = document.getElementById('previewLink');
    const editingDocIdInput = document.getElementById('editingDocId');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    let imageBase64 = "";
    let currentGiftUrl = "";

    // دالة لتقليل حجم الصورة تلقائياً لتتجاوز حدود Firestore بدون التأثير على المظهر
    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(compressedDataUrl);
        };
      };
    }

    // معاينة الصورة المختارة وضغطها تلقائياً
    imageFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        statusDiv.textContent = 'جاري تجهيز الصورة...';
        statusDiv.className = 'status-message';

        compressImage(file, 800, 0.7, function(compressedBase64) {
          imageBase64 = compressedBase64;
          imagePreview.src = imageBase64;
          imagePreview.style.display = 'block';
          statusDiv.textContent = 'تم إرفاق الصورة بنجاح!';
          statusDiv.className = 'status-message status-success';
        });
      } else if (!editingDocIdInput.value) {
        imageBase64 = "";
        imagePreview.style.display = 'none';
      }
    });

    // جلب بيانات الهدية للتعديل
    document.getElementById('loadGiftBtn').addEventListener('click', async () => {
      let inputVal = document.getElementById('searchGiftId').value.trim();
      if (!inputVal) return;

      if (inputVal.includes('id=')) {
        inputVal = inputVal.split('id=')[1].split('&')[0];
      }

      statusDiv.textContent = 'جاري جلب البيانات...';
      statusDiv.className = 'status-message';

      try {
        const doc = await db.collection('gifts').doc(inputVal).get();
        if (doc.exists) {
          const data = doc.data();
          editingDocIdInput.value = doc.id;
          
          document.getElementById('recipientName').value = data.recipientName || '';
          document.getElementById('occasion').value = data.occasion || '';
          document.getElementById('message').value = data.message || '';
          document.getElementById('audioUrl').value = data.audioUrl || '';
          
          if (data.imageUrl) {
            imageBase64 = data.imageUrl;
            imagePreview.src = data.imageUrl;
            imagePreview.style.display = 'block';
          } else {
            imageBase64 = "";
            imagePreview.style.display = 'none';
          }

          formTitle.textContent = "تعديل الهدية";
          submitBtn.textContent = "تحديث بيانات الهدية";
          cancelEditBtn.style.display = "block";
          
          renderQRCode(doc.id);
          statusDiv.textContent = 'تم جلب البيانات بنجاح، قم بتعديل البيانات المطلوبة وأكد الحفظ.';
          statusDiv.className = 'status-message status-success';
        } else {
          statusDiv.textContent = 'لم يتم العثور على هدية بهذا الرقم المعرف.';
          statusDiv.className = 'status-message status-error';
        }
      } catch (err) {
        statusDiv.textContent = 'خطأ أثناء جلب البيانات: ' + err.message;
        statusDiv.className = 'status-message status-error';
      }
    });

    // إلغاء وضع التعديل والعودة للإنشاء
    cancelEditBtn.addEventListener('click', resetForm);

    function resetForm() {
      editingDocIdInput.value = "";
      giftForm.reset();
      imageBase64 = "";
      imagePreview.style.display = 'none';
      formTitle.textContent = "إنشاء هدية جديدة";
      submitBtn.textContent = "حفظ الهدية";
      cancelEditBtn.style.display = "none";
      qrContainer.style.display = 'none';
      statusDiv.textContent = "";
    }

    // دالة إنشاء رسم الـ QR Code
    function renderQRCode(docId) {
      qrcodeDiv.innerHTML = '';
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      currentGiftUrl = `${baseUrl}index.html?id=${docId}`;

      new QRCode(qrcodeDiv, {
        text: currentGiftUrl,
        width: 180,
        height: 180,
        colorDark: "#2c3e50",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      previewLink.href = currentGiftUrl;
      qrContainer.style.display = 'block';
    }

    // حفظ أو تحديث الهدية
    giftForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusDiv.textContent = 'جاري الحفظ...';
      statusDiv.className = 'status-message';

      const recipientName = document.getElementById('recipientName').value.trim();
      const occasion = document.getElementById('occasion').value.trim();
      const message = document.getElementById('message').value.trim();
      const audioUrl = document.getElementById('audioUrl').value.trim();
      const editingId = editingDocIdInput.value;

      const payload = {
        recipientName: recipientName,
        occasion: occasion || "",
        message: message,
        audioUrl: audioUrl || "",
        imageUrl: imageBase64 || "",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        let finalId = editingId;

        if (editingId) {
          // تحديث الهدية القديمة بنفس الـ ID
          await db.collection('gifts').doc(editingId).update(payload);
          statusDiv.textContent = 'تم تحديث البيانات بنجاح لنفس الباركود!';
        } else {
          // إضافة هدية جديدة
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          const docRef = await db.collection('gifts').add(payload);
          finalId = docRef.id;
          statusDiv.textContent = 'تم حفظ الهدية بنجاح!';
        }

        statusDiv.className = 'status-message status-success';
        renderQRCode(finalId);

        if (!editingId) {
          giftForm.reset();
          imagePreview.style.display = 'none';
          imageBase64 = "";
        }
      } catch (error) {
        console.error("Error saving document: ", error);
        statusDiv.textContent = 'حدث خطأ أثناء الحفظ: ' + error.message;
        statusDiv.className = 'status-message status-error';
      }
    });

    // نسخ الرابط
    copyBtn.addEventListener('click', () => {
      if (currentGiftUrl) {
        navigator.clipboard.writeText(currentGiftUrl).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = 'تم النسخ! ✓';
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 2000);
        }).catch(err => {
          alert("فشل نسخ الرابط، يمكنك نسخه يدوياً: " + currentGiftUrl);
        });
      }
    });
  </script>

</body>
</html>
