<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إنشاء هدية جديدة</title>
  <link rel="stylesheet" href="style.css">
  <!-- مكتبة QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="container admin-container">
    <h1>🎁 إنشاء هدية جديدة</h1>
    <form id="giftForm">
      <div class="form-group">
        <label for="recipient">اسم المستلم:</label>
        <input type="text" id="recipient" placeholder="أدخل اسم الشخص" required>
      </div>

      <div class="form-group">
        <label for="message">الرسالة:</label>
        <textarea id="message" rows="4" placeholder="اكتب رسالتك الجميلة هنا..." required></textarea>
      </div>

      <div class="form-group">
        <label for="imageUrl">رابط الصورة (اختياري):</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
      </div>

      <button type="submit" id="submitBtn">إنشاء الهدية 🚀</button>
    </form>

    <div id="result" class="result-box hidden">
      <h3>تم إنشاء الهدية بنجاح! 🎉</h3>
      <p>رابط الهدية:</p>
      <div class="link-box">
        <input type="text" id="giftUrlInput" readonly>
        <button id="copyBtn">نسخ الرابط</button>
      </div>
      <div id="qrcode" class="qr-container"></div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
